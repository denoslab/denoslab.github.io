- url: /news/leo-wei-new-job-toronto/
  image: /images/news/leo-wei-new-job-toronto/leo-msc-defense.jpg
  alt: Leo Wei at his MSc thesis defense
  date: Jul 9, 2026
  title: Leo Wei joins Citizen Relations as AI Technical Lead in Toronto
  text: >-
    DENOS Lab alumnus Leo Wei is moving to Toronto to lead artificial intelligence work at
    Citizen Relations, a public relations agency with offices around the world, capping a
    Master's marked by a Best Paper Award at IEEE ATC 2025 and research on federated learning
    for supply chain demand forecasting.

- url: https://cumming.ucalgary.ca/focus-impact/harnessing-data-research
  external: true
  image: /images/news/harnessing-data-research/cover.jpg
  alt: Dr. Steve Drew and Dr. Jessalyn Holodinsky at the emergency department
  date: Jun 2026
  title: "Harnessing data research: AI in the emergency department"
  cta: Read the feature →
  text: >-
    Dr. Steve Drew and the DENOS Lab are featured by the University of Calgary for ED Sim,
    an AI simulation platform whose autonomous agents model patients, staff, and workflows
    so that emergency departments can find bottlenecks and test solutions without
    disrupting real operations.
