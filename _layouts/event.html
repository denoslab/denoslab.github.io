---
layout: page
---
{% if page.display_date %}<p class="event-date">{{ page.display_date }}</p>{% endif %}

<div class="event-content">
  {{ content }}
</div>

{% if page.poster %}
<figure class="event-figure">
  <a href="{{ page.poster_link | default: page.poster | relative_url }}" target="_blank" rel="noopener">
    <img src="{{ page.poster | relative_url }}" alt="{{ page.poster_caption | default: page.title }}">
  </a>
  {% if page.poster_caption %}<figcaption>{{ page.poster_caption }}</figcaption>{% endif %}
</figure>
{% endif %}

{% if page.images %}
<div class="event-gallery">
  {% for img in page.images %}
  <a class="event-photo" href="{{ img | relative_url }}" target="_blank" rel="noopener">
    <img src="{{ img | relative_url }}" alt="{{ page.title }}">
  </a>
  {% endfor %}
</div>
{% endif %}
