{%- assign m = include.member -%}
{%- if m.category == 0 or m.category == 5 -%}
<article class="member-card member-card--lead">
  <a class="member-photo-link" href="{{ m.url | relative_url }}"><img class="member-photo" src="{{ m.picture | relative_url }}" alt="{{ m.name }}"></a>
  <div class="member-info">
    <h3 class="member-name"><a href="{{ m.url | relative_url }}">{{ m.name }}</a></h3>
    <p class="member-role">{{ m.title }}</p>
    <div class="member-bio">{{ m.summary | markdownify }}</div>
  </div>
</article>
{%- else -%}
<article class="member-card">
  <a class="member-photo-link" href="{{ m.url | relative_url }}"><img class="member-photo" src="{{ m.picture | relative_url }}" alt="{{ m.name }}"></a>
  <div class="member-info">
    <h3 class="member-name"><a href="{{ m.url | relative_url }}">{{ m.name }}</a></h3>
    <p class="member-role">{{ m.title }}</p>
    <div class="member-tags">{{ m.summary | markdownify }}</div>
  </div>
</article>
{%- endif -%}
