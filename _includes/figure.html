<figure class="event-figure{% if include.class %} {{ include.class }}{% endif %}">
  <a href="{{ include.link | default: include.src | relative_url }}" target="_blank" rel="noopener">
    <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption }}">
  </a>
  {% if include.caption %}<figcaption>{{ include.caption }}</figcaption>{% endif %}
</figure>
