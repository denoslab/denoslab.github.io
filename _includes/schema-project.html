<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ResearchProject",
      "@id": "{{ page.url | absolute_url }}#project",
      "name": {{ page.title | strip_newlines | strip | jsonify }},
      {%- if page.short_name %}
      "alternateName": {{ page.short_name | jsonify }},
      {%- endif %}
      {%- if page.description %}
      "description": {{ page.description | strip_newlines | strip | jsonify }},
      {%- endif %}
      "url": "{{ page.url | absolute_url }}",
      {%- if page.logo %}
      "image": "{{ page.logo | absolute_url }}",
      {%- endif %}
      {%- if page.links %}
      "sameAs": [
        {%- for link in page.links %}{% if link.url contains 'http' %}"{{ link.url }}"{% unless forloop.last %}, {% endunless %}{% endif %}{% endfor %}
      ],
      {%- endif %}
      {%- if page.people %}
      "member": [
        {%- assign roster = '' | split: '' -%}
        {%- for person in page.people -%}
          {%- assign found = site.team | where: "url", person -%}
          {%- assign roster = roster | concat: found -%}
        {%- endfor -%}
        {%- for m in roster %}
        { "@type": "Person", "name": {{ m.name | jsonify }}, "url": "{{ m.url | absolute_url }}" }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ],
      {%- endif %}
      "parentOrganization": { "@id": "{{ '/#organization' | absolute_url }}" }
    },
    {
      "@type": "WebPage",
      "@id": "{{ page.url | absolute_url }}",
      "url": "{{ page.url | absolute_url }}",
      "name": {{ page.title | append: " | DENOS Lab" | jsonify }},
      {%- if page.description %}
      "description": {{ page.description | strip_newlines | strip | jsonify }},
      {%- endif %}
      "inLanguage": "en-CA",
      "isPartOf": { "@id": "{{ '/#website' | absolute_url }}" },
      "about": { "@id": "{{ page.url | absolute_url }}#project" },
      "breadcrumb": { "@id": "{{ page.url | absolute_url }}#breadcrumb" }
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{{ page.url | absolute_url }}#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ '/' | absolute_url }}" },
        { "@type": "ListItem", "position": 2, "name": "Research", "item": "{{ '/#research' | absolute_url }}" },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | strip_newlines | strip | jsonify }} }
      ]
    },
    {
      "@type": "Organization",
      "@id": "{{ '/#organization' | absolute_url }}",
      "name": "DENOS Lab",
      "alternateName": "Distributed Learning and Orchestration Lab",
      "url": "{{ '/' | absolute_url }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ '/images/denos-lab-logo.png' | absolute_url }}"
      }
    },
    {
      "@type": "WebSite",
      "@id": "{{ '/#website' | absolute_url }}",
      "url": "{{ '/' | absolute_url }}",
      "name": "DENOS Lab"
    }
  ]
}
</script>
